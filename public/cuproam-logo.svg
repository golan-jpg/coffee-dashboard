<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- רקע לבן עם מסגרת כחולה (תואם ל-Header של האתר) -->
  <circle cx="200" cy="200" r="180" fill="white" stroke="#0047AB" stroke-width="6"/>
  
  <!-- טבעת פנימית עדינה בצבע חום קפה -->
  <circle cx="200" cy="200" r="168" fill="none" stroke="#8B5A2B" stroke-width="2" opacity="0.6"/>

  <!-- אייקון ספל קפה קלאסי (צבע חום קפה) -->
  <g transform="translate(145, 110) scale(1.1)">
    <!-- גוף הספל -->
    <path d="M10 10H80V45C80 61.6 66.6 75 50 75C33.4 75 20 61.6 20 45V10Z" fill="#8B5A2B"/>
    <!-- ידית -->
    <path d="M80 15H88C94.6 15 100 20.4 100 27V33C100 39.6 94.6 45 88 45H80V15ZM80 20V40H88C91.9 40 95 36.9 95 33V27C95 23.1 91.9 20 88 20H80Z" fill="#8B5A2B"/>
    <!-- תחתית הספל -->
    <rect x="15" y="82" width="70" height="4" rx="2" fill="#8B5A2B"/>
  </g>

  <!-- שם המותג בשילוב הצבעים של האתר -->
  <text x="200" y="275" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="900" font-size="42" text-anchor="middle" letter-spacing="1">
    <tspan fill="#0047AB">CUP</tspan><tspan fill="#8B5A2B">ROAM</tspan>
  </text>

  <!-- סלוגן תחתון -->
  <text x="200" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666" font-weight="bold" letter-spacing="1.5">
    BEST SPECIALTY COFFEE
  </text>
</svg>
